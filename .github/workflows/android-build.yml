name: Android APK et AAB

on:
  workflow_dispatch:
  push:
    branches: [main, android-essor-app-fr]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer Android 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Préparer ESSOR 1.2.0 pour essor-app.fr
        working-directory: android
        run: |
          set -euo pipefail
          sed -i 's#essor-app.valentin88hernandez.chatgpt.site#essor-app.fr#g' app/build.gradle
          sed -i 's#ESSOR — Chaque jour reprend du terrain#ESSOR — Reprendre le contrôle#g' app/build.gradle
          sed -i 's#versionCode 2#versionCode 3#g' app/build.gradle
          sed -i 's#versionName "1.1.0"#versionName "1.2.0"#g' app/build.gradle
          ! grep -R "essor-app.valentin88hernandez.chatgpt.site" app twa-manifest.json
          grep -q "hostName: 'essor-app.fr'" app/build.gradle
          grep -q 'versionCode 3' app/build.gradle
          grep -q 'versionName "1.2.0"' app/build.gradle

      - name: Préparer la signature Play
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Compiler APK et AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Publier les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: ESSOR-Android-1.2.0
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
