name: Android APK et AAB

on:
  workflow_dispatch:
  push:
    branches: [main, hostinger-migration]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer Android 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Préparer ESSOR 1.2.0 pour essor-app.fr
        working-directory: android
        run: |
          set -euo pipefail
          sed -i 's#essor-app.valentin88hernandez.chatgpt.site#essor-app.fr#g' app/build.gradle
          sed -i 's#ESSOR — Chaque jour reprend du terrain#ESSOR — Reprendre le contrôle#g' app/build.gradle
          sed -i 's#versionCode 2#versionCode 3#g' app/build.gradle
          sed -i 's#versionName "1.1.0"#versionName "1.2.0"#g' app/build.gradle
          ! grep -R "essor-app.valentin88hernandez.chatgpt.site" app twa-manifest.json
          grep -q "hostName: 'essor-app.fr'" app/build.gradle
          grep -q 'versionCode 3' app/build.gradle
          grep -q 'versionName "1.2.0"' app/build.gradle
          grep -q '"host": "essor-app.fr"' twa-manifest.json

      - name: Détecter la signature Play
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signature Play absente : le workflow ne publiera aucun AAB prétendument prêt pour Google Play."
          fi

      - name: Préparer la signature Play
        if: ${{ steps.signing.outputs.ready == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Compiler APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Compiler APK release et AAB Play signés
        if: ${{ steps.signing.outputs.ready == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Vérifier cryptographiquement l’AAB Play
        if: ${{ steps.signing.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          jarsigner -verify -verbose android/app/build/outputs/bundle/release/app-release.aab > /tmp/aab-signature.txt
          grep -q "jar verified" /tmp/aab-signature.txt
          echo "AAB signé et vérifié."

      - name: Publier l’APK de test
        uses: actions/upload-artifact@v4
        with:
          name: ESSOR-Android-1.2.0-DEBUG
          if-no-files-found: error
          retention-days: 14
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier les fichiers Google Play signés
        if: ${{ steps.signing.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ESSOR-Android-1.2.0-PLAY-SIGNED
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/app-release.aab
