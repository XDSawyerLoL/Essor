name: Android APK et AAB

on:
  workflow_dispatch:
  push:
    branches: [main, hostinger-migration]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer Android 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Vérifier la configuration ESSOR 1.2.0
        working-directory: android
        run: |
          set -euo pipefail
          ! grep -R "essor-app.valentin88hernandez.chatgpt.site" app twa-manifest.json
          grep -q "hostName: 'essor-app.fr'" app/build.gradle
          grep -q 'versionCode 3' app/build.gradle
          grep -q 'versionName "1.2.0"' app/build.gradle
          grep -q '"host": "essor-app.fr"' twa-manifest.json

      - name: Préparer la signature Play
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Compiler APK debug, APK release et AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Publier les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: ESSOR-Android-1.2.0
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/app-release.aab
