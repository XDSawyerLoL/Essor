name: Temporary Atlas APK Build

on:
  push:
    branches: [atlas-build-20260823]
    paths-ignore:
      - 'ci-output/**'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Atlas branch
        uses: actions/checkout@v4
        with:
          ref: atlas-build-20260823
          fetch-depth: 0
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and publish result to branch
        shell: bash
        run: |
          set +e
          rm -rf ci-output android node_modules
          mkdir -p ci-output
          LOG=/tmp/atlas-build.log
          : > "$LOG"
          STATUS=0

          npm install --no-audit --no-fund >> "$LOG" 2>&1 || STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            npx expo prebuild --platform android --non-interactive >> "$LOG" 2>&1 || STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then
            chmod +x android/gradlew
            (cd android && ./gradlew assembleDebug --no-daemon --stacktrace) >> "$LOG" 2>&1 || STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ] && [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            base64 -w 0 android/app/build/outputs/apk/debug/app-debug.apk > ci-output/Atlas-V0.apk.b64
            echo success > ci-output/status.txt
          else
            echo failed > ci-output/status.txt
            echo "exit_code=$STATUS" >> ci-output/status.txt
          fi

          tail -n 500 "$LOG" > ci-output/build-tail.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-output
          git commit -m "ci: publish Atlas APK result" || true
          git push origin HEAD:atlas-build-20260823
