name: Temporary Atlas APK Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Atlas PR
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Atlas-V0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-V0-APK
          path: Atlas-V0.apk
          retention-days: 7
          if-no-files-found: error
