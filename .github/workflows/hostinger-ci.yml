name: ESSOR Hostinger CI

on:
  push:
    branches: [hostinger-migration]
    paths:
      - "app/**"
      - "build/**"
      - "hostinger/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hostinger-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enregistrer le run Hostinger
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-meta
          cat > .github/build-meta/hostinger-last-build.txt <<EOF
          run_id=$RUN_ID
          head_sha=$HEAD_SHA
          status=running
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-meta/hostinger-last-build.txt
          if ! git diff --cached --quiet; then
            git commit -m "Enregistre le run Hostinger ESSOR"
            git push origin HEAD:hostinger-migration
          fi

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchroniser package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Installer
        run: npm ci --no-audit --no-fund

      - name: Vérifier le runtime Hostinger
        run: npm run check:hostinger

      - name: Construire la version Hostinger
        run: npm run build:hostinger

      - name: Vérifier l’export
        run: |
          test -s hostinger-dist/public/index.html
          test -s hostinger-dist/public/.well-known/assetlinks.json
          grep -q 'ESSOR — Reprendre le contrôle' hostinger-dist/public/index.html
          grep -q 'com.xdsawyer.essor' hostinger-dist/public/.well-known/assetlinks.json
          ! grep -R -q 'xdsawyerlol.github.io/Essor' hostinger-dist/public/index.html

      - name: Enregistrer package-lock si nécessaire
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock déjà synchronisé"
            exit 0
          fi
          git commit -m "Synchronise package-lock pour Hostinger"
          git reset --hard HEAD
          git pull --rebase origin hostinger-migration
          git push origin HEAD:hostinger-migration

      - name: Enregistrer le statut du build Hostinger
        if: ${{ always() }}
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-meta
          cat > .github/build-meta/hostinger-last-build.txt <<EOF
          run_id=$RUN_ID
          head_sha=$HEAD_SHA
          status=$BUILD_STATUS
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-meta/hostinger-last-build.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enregistre le dernier build Hostinger ESSOR"
          git reset --hard HEAD
          git pull --rebase origin hostinger-migration
          git push origin HEAD:hostinger-migration
